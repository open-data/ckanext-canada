  datastore_primary_key: ["reference_number", "year"]
  datastore_indexes: ""

  default_preview_sort: year, reference_number

  triggers:
  - demo_info_trigger: |
      DECLARE
        errors text[][] := '{{}}';
        crval RECORD;
        importing boolean NOT NULL := (SELECT EXISTS (SELECT 1 FROM datastore_app_context WHERE 'recombinant_import' = ANY(flags)));
      BEGIN
        -- NOTE: always require primary keys and record state
        errors := errors || required_error(NEW.record_state, 'record_state');
        errors := errors || required_error(NEW.reference_number, 'reference_number');
        IF NEW.reference_number LIKE '%,%' THEN
          errors := errors || ARRAY[['reference_number', {reference_number_error}]];
        END IF;
        NEW.reference_number := trim_lead_trailing(NEW.reference_number);
        errors := errors || required_error(NEW.year, 'year');

        -- NOTE: skip all other required validation if draft
        IF NEW.record_state = 'active' THEN
          errors := errors || required_error(NEW.country, 'country');
          errors := errors || required_error(NEW.reason, 'reason');
        END IF;

        errors := errors || choice_error(NEW.country, {country}, 'country');

        crval := choices_clean_error(NEW.reason, {reason}, 'reason');
        errors := errors || crval.error;

        NEW.additional_info := trim_lead_trailing(NEW.additional_info);
        errors := errors || max_char_error(NEW.additional_info, 350, 'additional_info');

        IF TG_OP = 'UPDATE' THEN
          errors := errors || required_error(NEW._id, '_id');
        END IF;

        IF errors = '{{}}' THEN
          IF NOT importing AND TG_OP = 'INSERT' THEN
            NEW._id := nextval({sequence_name}) * 100 + 99;
            NEW._id := NEW._id - (NEW._id - {sequence_modulo_offset}) % 97;
          END IF;
          RETURN NEW;
        END IF;
        RAISE EXCEPTION E'TAB-DELIMITED\t%', array_to_string(errors, E'\t');
      END;
  - update_record_modified_created_trigger

  trigger_strings:  # yaml | not supported
    required_error: This field must not be empty
    reference_number_error: Comma is not allowed in Reference Number field
    max_length_error: This field has a maximum length of {} characters.

  examples:
    record:
