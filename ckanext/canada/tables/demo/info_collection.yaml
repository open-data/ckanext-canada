dataset_type: demo_info
target_dataset: demo_info


title: Demo Info Collection Dataset Type
shortname: Demo Info Collection Dataset Type
notes: Demo Info Collection Dataset Type

# open_canada_id generation rule:
#
#   Assign unique _id across *all* records and so that (_id % 97) == 49
#   These _id values are exported as open_canada_id in the combined csv dataset
#
#   The last two _id digits are check digits. Mod 97 prevents almost all numeric
#   typos (Mod 97 is also used for international bank account check digits)
#
#   49 chosen only because "Demo Info", D ≈ 4, I ≈ 9.
#   open_canada_id values for other record types use values
#   different than 49 so that open_canada_ids are unique across all record types
#
#   Use check digits from 03-99 because numbers ending in 00 look approximate,
#   i.e. for all open_canada_id values (_id % 100) > 2
datastore_create_sequence: demo_info_seq
sequence_modulo_offset: 49

template_version: 3

portal_type: dataset
collection: demo

